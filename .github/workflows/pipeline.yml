name: Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt
      - name: Tests ausführen
        run: python -m pytest -v

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

  deploy:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten prüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ ${#DEPLOY_TOKEN} -eq 0 ]; then echo "::error::DEPLOY_TOKEN is empty"; exit 1; fi

  release:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: app-paket
          path: build/
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Release" \
            build/app.zip
